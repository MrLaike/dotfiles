animations = true;
animation-stiffness-in-tag = 100;
animation-stiffness-tag-change = 20.0;

animation-window-mass = 0.5;
animation-dampening = 7;
animation-clamping = true;

animation-for-open-window = "zoom";
animation-for-unmap-window = "squeeze";
animation-for-transient-window = "slide-up"; 

animation-for-prev-tag = "minimize";
enable-fading-prev-tag = true;

animation-for-next-tag = "slide-in-center";
enable-fading-next-tag = true;

#   ______ _               _             
#  / _____) |             | |            
# ( (____ | |__  _____  __| | ___  _ _ _ 
#  \____ \|  _ \(____ |/ _  |/ _ \| | | |
#  _____) ) | | / ___ ( (_| | |_| | | | |
# (______/|_| |_\_____|\____|\___/ \___/ 

shadow = true;
shadow-radius = 15;
shadow-opacity = 0.7;
shadow-offset-x = -14;
shadow-offset-y = -14;

shadow-color = "#000000";

shadow-exclude = [
	"name = 'Notification'",
	"name = 'rofi'",
	"class_g = 'Conky'",
	"class_g ?= 'Notify-osd'",
	"class_g = 'Cairo-clock'",
	"class_g = 'slop'",
	"class_g = 'Firefox' && argb",
	"class_g = 'Rofi'",
	"_GTK_FRAME_EXTENTS@:c",
	"_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# shadow-exclude-reg = "x10+0+0";
xinerama-shadow-crop = false;

#  ______                       _           _ 
# (_____ \                     | |         | |
#  _____) )___  _   _ ____   __| |_____  __| |
# |  __  // _ \| | | |  _ \ / _  | ___ |/ _  |
# | |  \ \ |_| | |_| | | | ( (_| | ____( (_| |
# |_|   |_\___/|____/|_| |_|\____|_____)\____|
                                            
				corner-radius = 10;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g     = 'dwm'",
];

#  _______         _ _             
# (_______)       | (_)            
#  _____ _____  __| |_ ____   ____ 
# |  ___|____ |/ _  | |  _ \ / _  |
# | |   / ___ ( (_| | | | | ( (_| |
# |_|   \_____|\____|_|_| |_|\___ |
#                           (_____|

fading = true;
fade-in-step = 0.07;
fade-out-step = 0.03;
fade-delta = 4;

fade-exclude = [];

no-fading-openclose = false;
no-fading-destroyed-argb = true;

#  _______                   _             
# (_______)                 (_)  _         
#  _     _ ____  _____  ____ _ _| |_ _   _ 
# | |   | |  _ \(____ |/ ___) (_   _) | | |
# | |___| | |_| / ___ ( (___| | | |_| |_| |
#  \_____/|  __/\_____|\____)_|  \__)\__  |
#         |_|                       (____/ 

inactive-opacity = 0.8;
frame-opacity = 0.5;
inactive-opacity-override = false;
active-opacity = 1.0;
inactive-dim = 0.0;

focus-exclude = [
	"class_g = 'Cairo-clock'",
	"class_g ?= 'slop'",
	"class_g ?= 'Steam'",
	"class_g ?= 'Firefox' && argb",
	"class_g ?= 'rofi'",
];

# inactive-dim-fixed = 1.0;

opacity-rule = [ 
	"70:class_g = 'URxvt'",
	"80:class_g = 'UXTerm'",
	"80:class_g = 'XTerm'",
	"100:class_g = 'St' && focused",
	"80:class_g = 'St' && !focused",
	"80:class_g = 'firefox' && !focused",
	"80:class_g = 'phpstorm' && !focused",
	"100:fullscreen",
]

#  ______  _              
# (____  \| |             
#  ____)  ) | _   _  ____ 
# |  __  (| || | | |/ ___)
# | |__)  ) || |_| | |    
# |______/ \_)____/|_|    

blur: {
	method = "dual_kawase";
   	strength = 12.0;
	deviation = 1.0;
	kernel = "11x11gaussian";
}

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-kern = "5x5box";

blur-background-exclude = [
	"class_g = 'slop'",
	"_GTK_FRAME_EXTENTS@:c"
];

#   ______                   _                  
#  / _____)        _     _  (_)                 
# ( (____  _____ _| |_ _| |_ _ ____   ____  ___ 
#  \____ \| ___ (_   _|_   _) |  _ \ / _  |/___)
#  _____) ) ____| | |_  | |_| | | | ( (_| |___ |
# (______/|_____)  \__)  \__)_|_| |_|\___ (___/ 
#                                   (_____|     

backend = "glx"
dithered-present = false;
vsync = true
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = false;
detect-client-opacity = false;
use-ewmh-active-win = true;
unredir-if-possible = false;
detect-transient = true;
# detect-client-leader = false
# resize-damage = 1
# invert-color-include = []
glx-no-stencil = true;
# glx-no-rebind-pixmap = false
use-damage = true;
xrender-sync-fence = true;
window-shader-fg = "default";
# force-win-blend = true;
# no-ewmh-fullscreen = false
# max-brightness = 1.0
transparent-clipping = false;
# transparent-clipping-exclude = []
log-level = "warn";
# log-file = "/path/to/your/log/file"
# show-all-xerrors = false
# write-pid-path = "/path/to/your/log/file"

wintypes:
{
	tooltip = { fade = true; shadow = false; focus = false; };
	normal = { shadow = false; };
	dock = { shadow = false; };
	dnd = { shadow = false; };
	popup_menu = { shadow = true; focus = false; opacity = 0.90; };
	dropdown_menu = { shadow = false; focus = false; };
	above = { shadow = true; };
	splash = { shadow = false; };
	utility = { focus = false; shadow = false; blur-background = false; };
	notification = { shadow = false; };
	desktop = { shadow = false; blur-background = false; };
	menu = { focus = false; };
	dialog = { shadow = true; };
};


